<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Compass Calibrator</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>Compass Calibrator</h1>
          <p>Batch-calibrate a selected magnetic heading source from source-aware historical data.</p>
        </div>
        <button id="refreshRuntime" type="button">Refresh</button>
      </header>
      <div id="message" class="message" hidden></div>

      <section class="panel">
        <h2>Sources</h2>
        <div class="grid">
          <label>
            Context
            <input id="context" value="vessels.self" list="contextOptions">
            <datalist id="contextOptions"></datalist>
          </label>
          <label>
            History backend URL
            <input id="baseUrl" value="http://victoriametrics:8428">
          </label>
          <label>
            History username
            <input id="historyUsername" autocomplete="username">
          </label>
          <label>
            History password
            <input id="historyPassword" type="password" autocomplete="current-password">
          </label>
          <label>
            Discovery from
            <input id="discoverFrom" type="datetime-local">
          </label>
          <label>
            Discovery to
            <input id="discoverTo" type="datetime-local">
          </label>
        </div>
        <div class="actions">
          <button id="discover" type="button">Discover historical sources</button>
        </div>
        <details class="advanced">
          <summary>Metric names</summary>
          <div class="grid">
            <label>
              Heading magnetic metric
              <input id="metricHeadingMagnetic" value="navigation_headingMagnetic">
            </label>
            <label>
              COG true metric
              <input id="metricCourseOverGroundTrue" value="navigation_courseOverGroundTrue">
            </label>
            <label>
              SOG metric
              <input id="metricSpeedOverGround" value="navigation_speedOverGround">
            </label>
            <label>
              Magnetic variation metric
              <input id="metricMagneticVariation" value="navigation_magneticVariation">
            </label>
            <label>
              Rate of turn metric
              <input id="metricRateOfTurn" value="navigation_rateOfTurn">
            </label>
          </div>
        </details>
        <div id="sources" class="tableWrap"></div>
      </section>

      <section class="panel">
        <h2>Calibration</h2>
        <div class="grid">
          <label>
            Heading source
            <input id="headingSource" list="headingSourceOptions">
            <datalist id="headingSourceOptions"></datalist>
          </label>
          <label>
            COG source
            <input id="cogSource" list="cogSourceOptions">
            <datalist id="cogSourceOptions"></datalist>
          </label>
          <label>
            SOG source
            <input id="sogSource" list="sogSourceOptions">
            <datalist id="sogSourceOptions"></datalist>
          </label>
          <label>
            Variation source
            <input id="variationSource" list="variationSourceOptions">
            <datalist id="variationSourceOptions"></datalist>
          </label>
          <label>
            From
            <input id="from" type="datetime-local">
          </label>
          <label>
            To
            <input id="to" type="datetime-local">
          </label>
          <label>
            Resolution (s)
            <input id="resolution" type="number" min="1" value="1">
          </label>
          <label>
            Minimum SOG (m/s)
            <input id="minSog" type="number" step="0.1" value="1.5">
          </label>
          <label>
            Maximum rate of turn (deg/s)
            <input id="maxRateOfTurn" type="number" step="0.1" value="0.5">
          </label>
          <label>
            Maximum COG rate (deg/s)
            <input id="maxCogRate" type="number" step="0.1" value="1">
          </label>
          <label>
            Bin size
            <select id="binSize">
              <option>5</option>
              <option selected>10</option>
              <option>15</option>
              <option>30</option>
            </select>
          </label>
          <label>
            Minimum samples per bin
            <input id="minSamplesPerBin" type="number" min="1" value="10">
          </label>
        </div>
        <div class="actions">
          <button id="calibrate" type="button">Run calibration</button>
        </div>
      </section>

      <section class="panel">
        <h2>Profile Review</h2>
        <div id="candidate" class="summary muted">No candidate profile yet.</div>
        <canvas id="plot" width="720" height="260"></canvas>
        <div id="table" class="tableWrap"></div>
        <div class="actions">
          <button id="activate" type="button" disabled>Activate candidate</button>
          <button id="reject" type="button" disabled>Reject candidate</button>
        </div>
      </section>

      <section class="panel">
        <h2>Runtime</h2>
        <div id="runtime" class="summary muted">Runtime not loaded.</div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
