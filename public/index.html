<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Compass Calibrator</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>Compass Calibrator</h1>
          <p>Live heading correction learning for Signal K magnetic heading data.</p>
        </div>
        <button id="refresh" class="secondary" type="button">Refresh</button>
      </header>

      <div id="message" class="message" hidden></div>

      <section class="panel statusPanel">
        <div class="panelTitle">
          <h2>Runtime</h2>
          <label class="switch">
            <input id="learningEnabled" type="checkbox">
            <span>Learning</span>
          </label>
        </div>
        <div id="runtime" class="runtimeGrid"></div>
      </section>

      <section class="panel">
        <h2>Correction Table</h2>
        <div id="summary" class="summaryGrid"></div>
        <canvas id="plot" width="940" height="340"></canvas>
        <div id="table" class="tableWrap"></div>
      </section>

      <dialog id="sectorDialog">
        <form method="dialog" class="dialogBody">
          <div class="panelTitle">
            <h2 id="sectorDialogTitle">Edit Sector</h2>
            <button id="closeSectorDialog" class="secondary tiny" value="cancel" type="submit">Close</button>
          </div>
          <div class="grid sectorEditGrid">
            <label>
              Sector
              <input id="sectorLabel" readonly>
            </label>
            <label>
              Correction
              <input id="manualCorrection" type="number" step="0.01">
            </label>
            <label class="checkboxLabel">
              <input id="manualLocked" type="checkbox">
              Locked
            </label>
          </div>
          <p id="sectorHint" class="muted"></p>
          <div class="actions">
            <button id="saveSector" type="button">Save changes</button>
            <button id="resetSector" class="danger" type="button">Delete correction</button>
          </div>
        </form>
      </dialog>

      <section class="panel">
        <h2>Table Backup</h2>
        <div class="actions">
          <button id="exportTable" type="button">Export table</button>
          <button id="importTable" class="secondary" type="button">Import table</button>
          <input id="importTableFile" class="fileInput" type="file" accept=".json,application/json">
          <button id="resetTable" class="danger" type="button">Reset table</button>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
